<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ivory — приглашение за стол</title>
<style>
  :root { color-scheme: dark; --bg: #0E0F12; --text: #F2EFE8; --muted: #A9A49A; --accent: #D8C7A0; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { padding: 32px 16px; max-width: 360px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .code { font: 600 28px ui-monospace, monospace; letter-spacing: 2px; margin: 8px 0 24px; color: var(--text); }
  a.button { display: block; padding: 16px; border-radius: 14px; background: var(--accent); color: #17140E; font-weight: 600; text-decoration: none; }
  small { display: block; margin-top: 20px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Вас зовут за стол в Ivory</h1>
  <p>Откройте приложение. Если не открылось само, введите код: Ivory → «Войти по коду».</p>
  <div class="code" id="code">—</div>
  <a class="button" id="open" href="#">Открыть Ivory</a>
  <small>Только виртуальные фишки, без реальных денег.</small>
</main>
<script>
  var c = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  document.getElementById('code').textContent = c || '—';
  var app = 'ivory://table/' + c;
  document.getElementById('open').href = app;
  if (c) setTimeout(function () { location.href = app; }, 300);
</script>
</body>
</html>
